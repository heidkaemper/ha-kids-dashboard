# Ruff keeps the integration's Python in Home Assistant's own style.
[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET", "PL", "RUF"]
ignore = [
    "PLR0911",  # a command dispatcher returns from many branches by design
    "PLR0912",
    "PLR0913",
    "PLR2004",  # small literal numbers (sizes, seconds) read better in place
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
